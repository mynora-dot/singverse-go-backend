name: singverse-go-backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make go-tools-setup dbmate-setup
      - run: make db-fresh-check docker-test docker-config-check
      - run: make go-backend-test
      - run: make go-mysql-check
      - run: make go-backend-build
      - run: python3 scripts/check-go-recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: singverse-go-backend-linux-amd64
          path: bin/singverse
          if-no-files-found: error
