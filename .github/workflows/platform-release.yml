name: platform-release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: platform-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GITHUB_TOKEN: ${{ github.token }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      GHCR_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - run: make docker-test docker-config-check
      - name: Validate all publishing destinations
        run: python3 infra/docker/release.py validate
      - name: Reuse release lock or resolve current stable clients once
        run: |
          mkdir -p .build/locked
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > .build/release.json
          python3 -c 'import json; from pathlib import Path; r=json.loads(Path(".build/release.json").read_text()); Path(".build/has-lock").write_text(str(any(a["name"]=="components.lock.json" for a in r["assets"])))'
          if [ "$(cat .build/has-lock)" = True ]; then
            gh release download "$RELEASE_TAG" --pattern components.lock.json --dir .build/locked
            python3 scripts/prepare-platform.py --lock .build/locked/components.lock.json
          else
            python3 scripts/prepare-platform.py
            gh release upload "$RELEASE_TAG" .build/platform/components.lock.json
          fi
      - run: make go-tools-setup dbmate-setup
      - run: make go-backend-test FRONTEND_DIST="$PWD/.build/platform/frontend"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-inputs
          path: .build/platform/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  build:
    needs: prepare
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-inputs
          path: .build/platform
      - uses: docker/setup-buildx-action@v3
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Restore checked OCI bytes for retries
        id: archive
        run: python3 infra/docker/release-artifact.py restore --name 'app-${{ matrix.arch }}.oci.tar'
      - name: Load the previously checked image
        if: steps.archive.outputs.found == 'true'
        run: skopeo copy oci-archive:/tmp/image.tar docker-daemon:singverse:check
      - name: Build platform with shared verified inputs
        if: steps.archive.outputs.found != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --file infra/docker/build/app.Dockerfile --target singverse \
            --platform "linux/$ARCH" --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --provenance=false --tag singverse:check \
            --output type=docker --output type=oci,dest=/tmp/image.tar .
      - name: Confirm version and source identity
        run: |
          test "$(docker run --rm --network none singverse:check --version)" = "$(cat VERSION)"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' singverse:check)" = "$GITHUB_SHA"
      - run: python3 infra/docker/check-go-container.py --backend-image singverse:check
      - run: python3 infra/docker/check-auth-docker.py --backend-image singverse:check
      - run: python3 infra/docker/check-bundled-releases.py --image singverse:check
      - run: python3 infra/docker/check-oci-artifact.py /tmp/image.tar --image singverse:check
      - name: Preserve checked bytes before publishing any image tag
        if: steps.archive.outputs.found != 'true'
        run: python3 infra/docker/release-artifact.py save --name 'app-${{ matrix.arch }}.oci.tar'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: /tmp/image.tar
          compression-level: 0
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      GHCR_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
      - name: Authenticate publishing destinations
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$ACR_PASSWORD" | skopeo login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - run: python3 infra/docker/release.py publish --artifacts artifacts
