name: platform-release
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
concurrency:
  group: platform-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  resolve:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Keep the resolver from this workflow revision when publishing an older tag.
      - uses: actions/checkout@v4
      - name: Lock the existing stable Release to its source commit
        id: release
        run: python3 infra/docker/resolve-release.py
  prepare:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SINGVERSE_VERSION: ${{ needs.resolve.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Validate all publishing destinations
        run: python3 infra/docker/release.py validate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Reuse release lock or resolve current stable clients once
        run: |
          mkdir -p .build/locked
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > .build/release.json
          python3 -c 'import json; from pathlib import Path; r=json.loads(Path(".build/release.json").read_text()); Path(".build/has-lock").write_text(str(any(a["name"]=="components.lock.json" for a in r["assets"])))'
          if [ "$(cat .build/has-lock)" = True ]; then
            gh release download "$RELEASE_TAG" --pattern components.lock.json --dir .build/locked
            python3 scripts/prepare-platform.py --lock .build/locked/components.lock.json
          else
            python3 scripts/prepare-platform.py
            gh release upload "$RELEASE_TAG" .build/platform/components.lock.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: platform-inputs
          path: .build/platform/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  build:
    needs: [resolve, prepare]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ needs.resolve.outputs.revision }}
      SINGVERSE_VERSION: ${{ needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          name: platform-inputs
          path: .build/platform
      - uses: docker/setup-buildx-action@v3
      - name: Restore release archive for retries
        id: archive
        run: python3 infra/docker/release-artifact.py restore --name 'app-${{ matrix.arch }}.oci.tar'
      - name: Build platform release archive
        if: steps.archive.outputs.found != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --file infra/docker/build/app.Dockerfile --target singverse \
            --platform "linux/$ARCH" --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SINGVERSE_VERSION=$SINGVERSE_VERSION" \
            --provenance=false --tag singverse:check \
            --output type=oci,dest=/tmp/image.tar .
      - name: Preserve release archive before publishing any image tag
        if: steps.archive.outputs.found != 'true'
        run: python3 infra/docker/release-artifact.py save --name 'app-${{ matrix.arch }}.oci.tar'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: /tmp/image.tar
          compression-level: 0
          retention-days: 7
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      SINGVERSE_VERSION: ${{ needs.resolve.outputs.version }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
      - name: Authenticate publishing destinations
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$ACR_PASSWORD" | skopeo login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Publish immutable images, then update latest
        run: python3 -u infra/docker/release.py publish --artifacts artifacts
